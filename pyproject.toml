[project]
name = "djbot"
version = "0.1.0"
description = "A DJ assistant that suggests harmonically and rhythmically compatible next tracks for TIDAL + Serato sets."
requires-python = ">=3.9"
dependencies = []

# Phase 3b audio analysis is optional so the core stays stdlib-only.
# Install with:  pip install "djbot[audio]"   (also requires ffmpeg on PATH).
# Previews come from free no-auth APIs (iTunes/Deezer) via stdlib — no yt-dlp.
[project.optional-dependencies]
audio = ["librosa"]

[project.scripts]
djbot = "djbot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["djbot"]
