<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>djbot · flight deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#03040c; --panel:rgba(10,16,38,.62); --edge:rgba(90,150,255,.35);
    --cyan:#46e6ff; --blue:#3a86ff; --violet:#b388ff; --purple:#7a3cff;
    --ink:#d7ecff; --dim:#7d92c4; --good:#46e6ff; --warn:#ffb454;
    --glow-cyan:0 0 18px rgba(70,230,255,.55); --glow-violet:0 0 18px rgba(179,136,255,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Share Tech Mono",ui-monospace,monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
  #stars{position:fixed;inset:0;z-index:0;display:block}
  /* nebula wash behind the stars */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(60% 50% at 78% 18%, rgba(122,60,255,.22), transparent 60%),
      radial-gradient(55% 45% at 18% 82%, rgba(58,134,255,.20), transparent 60%),
      radial-gradient(40% 35% at 50% 50%, rgba(70,230,255,.08), transparent 70%);}
  /* cockpit canopy frame */
  .frame{position:fixed;inset:0;z-index:2;pointer-events:none;
    border:2px solid var(--edge);
    box-shadow:inset 0 0 120px rgba(3,6,24,.95), inset 0 0 22px rgba(70,230,255,.10);
    -webkit-mask:linear-gradient(#000,#000);}
  .frame::before,.frame::after{content:"";position:absolute;width:120px;height:120px;border:2px solid var(--cyan);opacity:.5}
  .frame::before{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:14px 0 0 0;box-shadow:var(--glow-cyan)}
  .frame::after{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 14px 0;box-shadow:var(--glow-cyan)}

  .hud{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;
    padding:clamp(14px,3vw,34px);gap:14px;max-width:980px;margin:0 auto}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .logo{font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:.32em;
    font-size:clamp(15px,2.4vw,22px);color:#fff;text-shadow:var(--glow-cyan)}
  .logo b{color:var(--cyan)}
  .stat{font-size:11px;color:var(--dim);letter-spacing:.18em;text-align:right;line-height:1.5}

  .panel{background:var(--panel);border:1px solid var(--edge);border-radius:12px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 0 0 1px rgba(0,0,0,.4), inset 0 0 26px rgba(40,90,200,.07);}
  .label{font-size:10px;letter-spacing:.28em;color:var(--violet);text-transform:uppercase;margin-bottom:6px}

  /* NOW PLAYING */
  .now{padding:14px 16px;position:relative;overflow:hidden}
  .now .title{font-family:Orbitron,sans-serif;font-size:clamp(15px,2.6vw,21px);color:#fff;letter-spacing:.02em}
  .now .sub{color:var(--dim);font-size:12px;margin-top:3px}
  .gauges{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .gauge{flex:1;min-width:72px;text-align:center;padding:8px 6px;border:1px solid var(--edge);border-radius:9px;background:rgba(5,10,30,.5)}
  .gauge .v{font-family:Orbitron,sans-serif;font-size:clamp(16px,3vw,22px);color:var(--cyan);text-shadow:var(--glow-cyan)}
  .gauge .k{font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:3px}

  /* search */
  .search{position:relative}
  input[type=text]{width:100%;padding:11px 14px;background:rgba(4,9,26,.8);
    border:1px solid var(--edge);border-radius:10px;color:var(--ink);
    font-family:inherit;font-size:14px;letter-spacing:.04em;outline:none}
  input[type=text]:focus{border-color:var(--cyan);box-shadow:var(--glow-cyan)}
  input::placeholder{color:var(--dim)}
  .results{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:9;
    max-height:240px;overflow:auto;border-radius:10px;display:none}
  .results.on{display:block}
  .results .row{padding:9px 13px;cursor:pointer;border-bottom:1px solid rgba(90,150,255,.12);font-size:13px}
  .results .row:hover{background:rgba(70,230,255,.12)}
  .results .row .m{color:var(--dim);font-size:11px}

  /* mode tabs */
  .tabs{display:flex;gap:8px}
  .tab{flex:1;padding:10px;text-align:center;cursor:pointer;border:1px solid var(--edge);
    border-radius:10px;background:rgba(8,14,36,.55);letter-spacing:.16em;font-size:11px;
    color:var(--dim);text-transform:uppercase;transition:.15s;user-select:none}
  .tab:hover{color:var(--ink)}
  .tab.on{color:#fff;border-color:var(--cyan);box-shadow:var(--glow-cyan);
    background:linear-gradient(rgba(70,230,255,.14),rgba(122,60,255,.10))}

  /* fader / throttle */
  .throttle{padding:14px 16px;display:none}
  .throttle.on{display:block}
  .throttle .ends{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-bottom:6px}
  .throttle .ends .climb{color:var(--cyan)} .throttle .ends .cool{color:var(--violet)}
  input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:6px;
    background:linear-gradient(90deg,var(--violet),#13204a 50%,var(--cyan));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--cyan));cursor:pointer;box-shadow:var(--glow-cyan);border:2px solid #fff}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--cyan);border:2px solid #fff;box-shadow:var(--glow-cyan)}
  .throttle .read{text-align:center;margin-top:8px;font-size:12px;letter-spacing:.14em;color:var(--ink)}
  .throttle .read b{color:var(--cyan)}

  /* suggestions */
  .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}
  .card{padding:11px 13px;display:flex;align-items:center;gap:12px;cursor:pointer;
    border-left:3px solid var(--cyan);transition:.12s}
  .card:hover{transform:translateX(3px);box-shadow:-6px 0 18px rgba(70,230,255,.18)}
  .card .rank{font-family:Orbitron,sans-serif;font-size:16px;color:var(--violet);min-width:22px;text-shadow:var(--glow-violet)}
  .card .body{flex:1;min-width:0}
  .card .t{color:#fff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .r{color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .r .cur{color:var(--violet)}
  .chips{display:flex;gap:5px;flex-shrink:0}
  .chip{font-size:10px;padding:3px 7px;border-radius:6px;border:1px solid var(--edge);color:var(--cyan);letter-spacing:.06em}
  .chip.bpm{color:var(--violet)}
  .empty{color:var(--dim);text-align:center;padding:30px;font-size:13px;letter-spacing:.1em}
  .list::-webkit-scrollbar,.results::-webkit-scrollbar{width:8px}
  .list::-webkit-scrollbar-thumb,.results::-webkit-scrollbar-thumb{background:rgba(70,230,255,.3);border-radius:4px}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="frame"></div>

<div class="hud">
  <header>
    <div class="logo">DJ<b>BOT</b> · FLIGHT&nbsp;DECK</div>
    <div class="stat" id="stat">booting…</div>
  </header>

  <div class="panel search">
    <div style="padding:12px 14px 0"><div class="label">◇ Now playing — set current track</div></div>
    <div style="padding:0 14px 14px">
      <input id="q" type="text" placeholder="search artist or title…" autocomplete="off" />
      <div class="results panel" id="results"></div>
    </div>
  </div>

  <div class="panel now" id="now" style="display:none">
    <div class="label">▶ Now playing</div>
    <div class="title" id="nowTitle">—</div>
    <div class="sub" id="nowArtist"></div>
    <div class="gauges">
      <div class="gauge"><div class="v" id="gKey">—</div><div class="k">CAMELOT</div></div>
      <div class="gauge"><div class="v" id="gBpm">—</div><div class="k">BPM</div></div>
      <div class="gauge"><div class="v" id="gGen">—</div><div class="k">GENRE</div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" data-mode="next">› Next track</div>
    <div class="tab" data-mode="runway">›› Next three</div>
    <div class="tab" data-mode="steer">⟂ Steer</div>
  </div>

  <div class="panel throttle" id="throttle">
    <div class="ends"><span class="cool">◄ COOL DOWN / SLOWER</span><span class="climb">CLIMB / FASTER ►</span></div>
    <input id="fader" type="range" min="-100" max="100" value="0" step="5" />
    <div class="read" id="faderRead">HOLD — staying in the pocket</div>
  </div>

  <div class="list panel" id="list" style="padding:10px"><div class="empty">Set a now-playing track to get suggestions.</div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let state = { id:null, mode:"next", intensity:0 };

/* ---------- starfield: flying through deep space (steady drift v1) ---------- */
(function(){
  const c = $("#stars"), x = c.getContext("2d");
  let w,h,cx,cy,stars;
  function reset(){ w=c.width=innerWidth; h=c.height=innerHeight; cx=w/2; cy=h/2;
    stars = Array.from({length: Math.min(420, Math.round(w*h/4200))}, mk); }
  function mk(){ return { x:(Math.random()*2-1)*w, y:(Math.random()*2-1)*h, z:Math.random()*w,
    c: Math.random()<.18 ? "179,136,255" : (Math.random()<.5 ? "70,230,255" : "200,225,255") }; }
  const SPEED = 1.7;                         // v1 steady; later tie to fader intensity
  function tick(){
    x.fillStyle = "rgba(3,4,12,.38)"; x.fillRect(0,0,w,h);
    for(const s of stars){
      s.z -= SPEED;
      if(s.z<1){ Object.assign(s, mk()); s.z=w; }
      const k = 128/s.z, sx = cx + s.x*k, sy = cy + s.y*k;
      if(sx<0||sx>w||sy<0||sy>h) continue;
      const r = (1-s.z/w)*2.2;
      x.beginPath(); x.fillStyle = `rgba(${s.c},${(1-s.z/w).toFixed(2)})`;
      x.arc(sx,sy,Math.max(.4,r),0,7); x.fill();
    }
    requestAnimationFrame(tick);
  }
  addEventListener("resize", reset); reset(); tick();
})();

/* ---------- api ---------- */
const api = (p) => fetch(p).then(r=>r.json());

async function boot(){
  const s = await api("/api/state");
  $("#stat").innerHTML = `${s.total} TRACKS · ${s.mixable} MIXABLE<br>` +
    Object.entries(s.genres).slice(0,3).map(([g,n])=>`${g.replace(/_/g," ")} ${n}`).join(" · ");
}

/* ---------- search / now-playing ---------- */
let tmr;
$("#q").addEventListener("input", e=>{
  clearTimeout(tmr); const q = e.target.value.trim();
  if(!q){ $("#results").classList.remove("on"); return; }
  tmr = setTimeout(async ()=>{
    const rows = await api("/api/search?q="+encodeURIComponent(q));
    const box = $("#results");
    box.innerHTML = rows.length ? rows.map(t=>
      `<div class="row" data-id="${enc(t.id)}">${esc(t.artist)} — ${esc(t.title)}
        <span class="m">${t.camelot||"?"} · ${t.bpm?Math.round(t.bpm):"—"} BPM · ${(t.genre||"").replace(/_/g," ")}</span></div>`).join("")
      : `<div class="row m">no match</div>`;
    box.classList.add("on");
    box.querySelectorAll(".row[data-id]").forEach(r=>
      r.onclick=()=>setNow(dec(r.dataset.id)));
  }, 180);
});
document.addEventListener("click", e=>{ if(!e.target.closest(".search")) $("#results").classList.remove("on"); });

async function setNow(id){
  state.id = id;
  $("#results").classList.remove("on"); $("#q").value="";
  await run();
}

function showNow(t){
  $("#now").style.display="block";
  $("#nowTitle").textContent = t.title;
  $("#nowArtist").textContent = t.artist + (t.curators?.length? "  ·  played by "+t.curators.join(", ") : "");
  $("#gKey").textContent = t.camelot||"—";
  $("#gBpm").textContent = t.bpm?Math.round(t.bpm):"—";
  $("#gGen").textContent = (t.genre||"—").replace(/_/g," ");
}

/* ---------- modes ---------- */
document.querySelectorAll(".tab").forEach(tab=>tab.onclick=()=>{
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
  tab.classList.add("on"); state.mode = tab.dataset.mode;
  $("#throttle").classList.toggle("on", state.mode==="steer");
  run();
});

$("#fader").addEventListener("input", e=>{
  state.intensity = (+e.target.value)/100;
  const i = state.intensity;
  $("#faderRead").innerHTML = Math.abs(i)<.05 ? "HOLD — staying in the pocket"
    : (i>0 ? `CLIMB <b>+${(i*100|0)}%</b> — pushing tempo/energy up`
           : `COOL DOWN <b>${(i*100|0)}%</b> — easing the set down`);
  if(state.mode==="steer") run();
});

async function run(){
  if(!state.id) return;
  const L = $("#list"); L.innerHTML = `<div class="empty">scanning the catalog…</div>`;
  let data, items;
  if(state.mode==="next"){ data = await api("/api/next?id="+enc(state.id)); items = data.suggestions; }
  else if(state.mode==="runway"){ data = await api("/api/runway?id="+enc(state.id)+"&depth=3"); items = data.path; }
  else { data = await api("/api/steer?id="+enc(state.id)+"&intensity="+state.intensity); items = data.path; }
  if(data.now) showNow(data.now);
  render(items||[]);
}

function render(items){
  const L = $("#list");
  if(!items.length){ L.innerHTML = `<div class="empty">no compatible tracks found.</div>`; return; }
  L.innerHTML = items.map((t,i)=>{
    const reasons = (t.reasons||[]).map(r=>/played by/.test(r)?`<span class="cur">${esc(r)}</span>`:esc(r)).join("  ·  ");
    return `<div class="card panel" data-id="${enc(t.id)}">
      <div class="rank">${i+1}</div>
      <div class="body"><div class="t">${esc(t.artist)} — ${esc(t.title)}</div><div class="r">${reasons||"&nbsp;"}</div></div>
      <div class="chips"><span class="chip">${t.camelot||"?"}</span><span class="chip bpm">${t.bpm?Math.round(t.bpm):"—"}</span></div>
    </div>`;
  }).join("");
  // click a suggestion = advance the set to it
  L.querySelectorAll(".card[data-id]").forEach(c=>c.onclick=()=>setNow(dec(c.dataset.id)));
}

/* helpers */
const esc = s => (s||"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const enc = s => encodeURIComponent(s);
const dec = s => decodeURIComponent(s);
boot();
</script>
</body>
</html>
